name: Deterministic CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-exact-head-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-head:
    name: exact-head
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: system_builder
          POSTGRES_DB: system_builder
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U system_builder -d system_builder"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
      postgres_auth:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: deploy_auth
          POSTGRES_PASSWORD: ci-test-password
          POSTGRES_DB: system_builder_auth
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U deploy_auth -d system_builder_auth"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    env:
      SYSTEM_BUILDER_TEST_POSTGRES_URL: postgres://system_builder@127.0.0.1:5432/system_builder
      SYSTEM_BUILDER_TEST_AUTH_POSTGRES_URL: postgres://deploy_auth:ci-test-password@127.0.0.1:5433/system_builder_auth
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Assert exact PR head identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run deterministic repository verification
        run: npm run verify
