name: Station Cross-Platform Build

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/station/**"
      - "packages/ui-core/**"
      - "packages/ui-icons/**"
      - "packages/station-*/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - ".github/workflows/station-next-ci.yml"
  push:
    branches:
      - main
    paths:
      - "apps/station/**"
      - "packages/ui-core/**"
      - "packages/ui-icons/**"
      - "packages/station-*/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - ".github/workflows/station-next-ci.yml"

permissions:
  contents: read

concurrency:
  group: station-cross-platform-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  next-build:
    name: next-build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Checkout exact tested revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert exact PR head identity
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build Station with Next.js
        run: npm run station:build
