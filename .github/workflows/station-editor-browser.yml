name: Station Editor Browser Journey

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: station-editor-browser-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  station-editor-browser:
    name: station-editor-browser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Assert head identity
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build Station production application
        run: npm run station:build
      - name: Test actual browser journey
        run: npx playwright test --config tests/browser/station-editor.playwright.config.ts
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: station-editor-browser-${{ github.event.pull_request.head.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: error
          retention-days: 14
