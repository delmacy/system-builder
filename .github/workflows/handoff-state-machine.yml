name: Handoff State Machine

on:
  push:
    branches:
      - automation/handoff-state
    paths:
      - automation/handoff-state/REQUEST.json
  workflow_run:
    workflows:
      - Deterministic CI
      - Heavy Product Tests
    types:
      - completed
  schedule:
    - cron: "*/15 * * * *"
    - cron: "0 */8 * * *"
  workflow_dispatch:
    inputs:
      event_json:
        description: "Raw handoff event JSON for bounded manual recovery"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: system-builder-handoff-state-machine
  cancel-in-progress: false

jobs:
  reduce:
    name: reduce
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout operational state branch
        uses: actions/checkout@v7
        with:
          ref: automation/handoff-state
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Build event
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          DISPATCH_EVENT_JSON: ${{ inputs.event_json }}
        run: |
          set -euo pipefail
          mkdir -p .handoff-tmp
          case "$EVENT_NAME" in
            push)
              test -f automation/handoff-state/REQUEST.json
              cp automation/handoff-state/REQUEST.json .handoff-tmp/event.json
              ;;
            workflow_run)
              node -e 'const fs=require("fs"); fs.writeFileSync(".handoff-tmp/event.json", JSON.stringify({type:"CHECK_COMPLETED", workflow:process.env.WORKFLOW_NAME, conclusion:process.env.WORKFLOW_CONCLUSION, head:process.env.WORKFLOW_HEAD_SHA, at:new Date().toISOString()}));'
              ;;
            schedule)
              if [ "$EVENT_SCHEDULE" = "0 */8 * * *" ]; then
                printf '%s\n' '{"type":"CONFORMANCE_DUE"}' > .handoff-tmp/event.json
              else
                printf '%s\n' '{"type":"LEASE_TICK"}' > .handoff-tmp/event.json
              fi
              ;;
            workflow_dispatch)
              printf '%s\n' "$DISPATCH_EVENT_JSON" > .handoff-tmp/event.json
              ;;
            *)
              echo "Unsupported event source: $EVENT_NAME" >&2
              exit 1
              ;;
          esac

      - name: Reduce handoff state
        run: |
          node scripts/handoff-state-machine.mjs \
            --state automation/handoff-state/STATE.json \
            --event .handoff-tmp/event.json \
            --handoff automation/handoff-state/HANDOFF.md \
            --events automation/handoff-state/EVENTS.ndjson

      - name: Consume request inbox
        if: ${{ github.event_name == 'push' }}
        run: rm -f automation/handoff-state/REQUEST.json

      - name: Commit deterministic transition
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/handoff-state/STATE.json automation/handoff-state/HANDOFF.md automation/handoff-state/EVENTS.ndjson automation/handoff-state/REQUEST.json || true
          if git diff --cached --quiet; then
            echo "No state mutation to commit."
            exit 0
          fi
          state=$(node -e 'const s=require("./automation/handoff-state/STATE.json"); process.stdout.write(`${s.phase}_${s.owner}`)')
          git commit -m "automation(handoff): ${state}"
          git push origin HEAD:automation/handoff-state
