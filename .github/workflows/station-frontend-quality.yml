name: Station Frontend Quality

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/station/**"
      - "packages/ui-core/**"
      - "packages/ui-icons/**"
      - "packages/station-*/**"
      - "tests/component/**"
      - "tests/e2e/**"
      - "playwright.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/station-frontend-quality.yml"
  push:
    branches: [main]
    paths:
      - "apps/station/**"
      - "packages/ui-core/**"
      - "packages/ui-icons/**"
      - "packages/station-*/**"
      - "tests/component/**"
      - "tests/e2e/**"
      - "playwright.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/station-frontend-quality.yml"

permissions:
  contents: read

concurrency:
  group: station-frontend-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  component-tests:
    name: component-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact tested revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install bounded component-test harness
        run: npm install --no-save --no-package-lock vitest@3.2.4 jsdom@26.1.0 @testing-library/react@16.3.0
      - name: Run React component interaction tests
        run: npx vitest run tests/component --environment jsdom --passWithNoTests

  browser-quality:
    name: browser-e2e-a11y-visual
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact tested revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install bounded browser-quality harness
        run: npm install --no-save --no-package-lock @playwright/test@1.55.0 @axe-core/playwright@4.10.2
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build Station production bundle
        run: npm run station:build
      - name: Run Station browser journeys
        run: npx playwright test tests/e2e --project=chromium
      - name: Upload frontend quality evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: station-frontend-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14
