name: Windows Fresh Install

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-fresh-install-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-fresh-install:
    name: windows-node24-fresh-install
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Assert tested revision identity
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_SHA) {
            throw "Expected exact revision $env:EXPECTED_SHA but checked out $actual"
          }

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Report Windows toolchain
        shell: pwsh
        run: |
          Write-Host "OS: $([System.Environment]::OSVersion.VersionString)"
          node --version
          npm --version
          git --version

      - name: Install locked dependencies from clean checkout
        shell: pwsh
        run: npm ci

      - name: Run repository verification on Windows
        shell: pwsh
        run: npm run verify
